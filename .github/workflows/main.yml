name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Test / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run lint
        run: echo "Linting complete"

  build:
    name: Build / Package
    runs-on: ubuntu-latest
    needs: test          # запускається лише якщо test пройшов
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app:latest .

      - name: Verify image
        run: docker images